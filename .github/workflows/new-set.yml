name: Detect & Generate New Set Configs
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      set_code:
        description: 'Override: generate config for this set code only (skips detection)'
        required: false
        default: ''
      force:
        description: 'Pass --force to regenerate even if config already exists'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-new-sets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install

      - name: Detect new sets
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.set_code }}" ]; then
            echo "Manual override: ${{ github.event.inputs.set_code }}"
            result='[{"code":"${{ github.event.inputs.set_code }}","name":"override","released":"manual","incomplete":false}]'
          else
            result=$(node scripts/detect-new-sets.js)
          fi
          echo "Detected: $result"
          echo "sets=$result" >> "$GITHUB_OUTPUT"

      - name: Generate configs
        id: generate
        if: steps.detect.outputs.sets != '[]'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GLOBAL_FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          failed=""
          succeeded=""
          # Emit "code\tincomplete" per set so we can force-regen partial entries
          echo '${{ steps.detect.outputs.sets }}' | node -e "
            const stdin = require('fs').readFileSync(0,'utf8');
            const sets = JSON.parse(stdin);
            for (const s of sets) console.log(s.code + '\t' + (s.incomplete ? '1' : '0'));
          " > /tmp/codes.txt
          while IFS=$'\t' read -r code incomplete; do
            echo "=== Generating config for $code (incomplete=$incomplete) ==="
            flag="$GLOBAL_FORCE_FLAG"
            if [ -z "$flag" ] && [ "$incomplete" = "1" ]; then
              flag="--force"
            fi
            if node scripts/generate-config.js "$code" $flag; then
              succeeded="$succeeded $code"
            else
              failed="$failed $code"
            fi
          done < /tmp/codes.txt
          # Trim leading spaces
          succeeded="${succeeded# }"
          failed="${failed# }"
          echo "succeeded=$succeeded" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Succeeded: [$succeeded]"
          echo "Failed: [$failed]"

      - name: Validate
        id: validate
        if: steps.generate.outputs.succeeded != ''
        run: |
          node validate.js --check-scryfall
          validated=""
          failed=""
          for code in ${{ steps.generate.outputs.succeeded }}; do
            ok=1
            if [ -f "boosters/${code}-play.json" ]; then
              if ! node scripts/validate-generated.js "$code" play; then
                failed="$failed ${code}-play"
                ok=0
              fi
            fi
            if [ -f "boosters/${code}-collector.json" ]; then
              if ! node scripts/validate-generated.js "$code" collector; then
                failed="$failed ${code}-collector"
                ok=0
              fi
            fi
            if [ "$ok" = "1" ]; then
              validated="$validated $code"
            fi
          done
          validated="${validated# }"
          failed="${failed# }"
          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Validated: [$validated]"
          echo "Validation failed: [$failed]"
          # Don't exit non-zero — let the Report failures step run for any rejected configs.

      - name: Commit to master
        id: commit
        # All-or-nothing: only commit if EVERY validated config passed (no validation failures).
        # A partial-success commit is rare in practice (≤1 set per week) and the bookkeeping to
        # surgically revert rejected files isn't worth the complexity. On any validation failure,
        # the whole batch is rejected and an issue is filed.
        if: steps.generate.outputs.succeeded != '' && steps.validate.outputs.failed == ''
        run: |
          git diff --quiet metadata.json index.json boosters/ && {
            echo "No changes to commit (validated configs already up to date)."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          sets="${{ steps.generate.outputs.succeeded }}"
          sets_comma=$(echo "$sets" | tr ' ' ',' | sed 's/,$//')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boosters/ index.json metadata.json
          git commit -m "auto: add/update configs for $sets_comma"
          git pull --rebase origin master
          git push origin master
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Report failures
        # Fires for either generation OR validation failure — the alarm channel for the whole
        # pipeline. Without this, validation rejects vanish silently into a failed cron run.
        if: steps.generate.outputs.failed != '' || steps.validate.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gen_failed="${{ steps.generate.outputs.failed }}"
          val_failed="${{ steps.validate.outputs.failed }}"
          {
            echo "**Workflow run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -n "$gen_failed" ]; then
              echo "**Generation failed for:** \`$gen_failed\`"
              echo
              echo "Common causes: ANTHROPIC_API_KEY invalid, unparseable Claude response, Scryfall API error, WotC article unavailable."
              echo
            fi
            if [ -n "$val_failed" ]; then
              echo "**Validation rejected:** \`$val_failed\`"
              echo
              echo "Common causes: hallucinated CN ranges, missing collectorExclusive slot, omitted bonus-sheet/Special Guests metadata, structurally divergent slot layout."
              echo "These configs were NOT committed. Inspect the run logs for specific validator errors."
              echo
            fi
            echo "Retry a single set: \`gh workflow run new-set.yml --repo ${{ github.repository }} -f set_code=<code> -f force=true\`"
          } > /tmp/issue-body.md
          title="auto: pipeline failed"
          [ -n "$gen_failed" ] && title="$title — gen: $gen_failed"
          [ -n "$val_failed" ] && title="$title — val: $val_failed"
          gh issue create --title "$title" --label "automation,bug" --body-file /tmp/issue-body.md

      - name: Trigger homepage update
        if: steps.commit.outputs.committed == 'true'
        env:
          HOMEPAGE_DISPATCH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$HOMEPAGE_DISPATCH_TOKEN" ]; then
            echo "HOMEPAGE_DISPATCH_TOKEN not set — homepage will pick up on its daily cron"
            exit 0
          fi
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEPAGE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/benson/benson.github.io/actions/workflows/update-sets.yml/dispatches \
            -d '{"ref":"master"}'
