name: Detect & Generate New Set Configs
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      set_code:
        description: 'Override: generate config for this set code only (skips detection)'
        required: false
        default: ''
      force:
        description: 'Pass --force to regenerate even if config already exists'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-new-sets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install

      - name: Detect new sets
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.set_code }}" ]; then
            echo "Manual override: ${{ github.event.inputs.set_code }}"
            result='[{"code":"${{ github.event.inputs.set_code }}","name":"override","released":"manual"}]'
          else
            result=$(node scripts/detect-new-sets.js)
          fi
          echo "Detected: $result"
          echo "sets=$result" >> "$GITHUB_OUTPUT"

      - name: Generate configs
        id: generate
        if: steps.detect.outputs.sets != '[]'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          failed=""
          succeeded=""
          echo '${{ steps.detect.outputs.sets }}' | node -e "
            const stdin = require('fs').readFileSync(0,'utf8');
            const sets = JSON.parse(stdin);
            for (const s of sets) console.log(s.code);
          " > /tmp/codes.txt
          while IFS= read -r code; do
            echo "=== Generating config for $code ==="
            if node scripts/generate-config.js "$code" $FORCE_FLAG; then
              succeeded="$succeeded $code"
            else
              failed="$failed $code"
            fi
          done < /tmp/codes.txt
          # Trim leading spaces
          succeeded="${succeeded# }"
          failed="${failed# }"
          echo "succeeded=$succeeded" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Succeeded: [$succeeded]"
          echo "Failed: [$failed]"

      - name: Validate
        if: steps.generate.outputs.succeeded != ''
        run: |
          node validate.js --check-scryfall
          for code in ${{ steps.generate.outputs.succeeded }}; do
            if [ -f "boosters/${code}-play.json" ]; then
              node scripts/validate-generated.js "$code" || echo "WARN: validation flagged issues for $code"
            fi
          done

      - name: Create PR for generated configs
        id: pr
        if: steps.generate.outputs.succeeded != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet metadata.json index.json boosters/ && {
            echo "No changes to commit (configs already up to date)."
            exit 0
          }
          sets="${{ steps.generate.outputs.succeeded }}"
          sets_comma=$(echo "$sets" | tr ' ' ',' | sed 's/,$//')
          branch="auto/new-set-${sets_comma}-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add boosters/ index.json metadata.json
          git commit -m "auto: add/update configs for $sets_comma"
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base master \
            --head "$branch" \
            --title "auto: new set configs for $sets_comma" \
            --body "Auto-generated by new-set workflow ([run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})).

**Sets:** \`$sets_comma\`

Review before merging — especially CN ranges in \`pool\` arrays and slot counts. Generation uses Claude with web_search against the WotC collecting article, but the output is not guaranteed accurate.

After merge, homepage's \`update-sets.yml\` will pick up the new sets on its next run (or sooner if triggered).")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created PR: $pr_url"

      - name: Report failures
        if: steps.generate.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed="${{ steps.generate.outputs.failed }}"
          gh issue create \
            --title "auto: generation failed for sets: $failed" \
            --label "automation,bug" \
            --body "The new-set workflow failed to generate configs for: \`$failed\`

**Workflow run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

Check the logs for error details. Common causes:
- ANTHROPIC_API_KEY invalid or out of credits
- Claude didn't return parseable JSON (see extract step output)
- Scryfall API error
- WotC collecting article not available yet

You can retry a specific set with \`gh workflow run new-set.yml --repo ${{ github.repository }} -f set_code=<code>\`"

      - name: Trigger homepage update
        if: steps.pr.outputs.pr_url != ''
        env:
          HOMEPAGE_DISPATCH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$HOMEPAGE_DISPATCH_TOKEN" ]; then
            echo "HOMEPAGE_DISPATCH_TOKEN not set — homepage will pick up on its daily cron after the PR merges"
            exit 0
          fi
          echo "Note: homepage update will fire but won't see new configs until the PR is merged"
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEPAGE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/benson/benson.github.io/actions/workflows/update-sets.yml/dispatches \
            -d '{"ref":"master"}'
