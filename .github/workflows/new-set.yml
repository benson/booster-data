name: Detect & Generate New Set Configs
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      set_code:
        description: 'Override: generate config for this set code only (skips detection)'
        required: false
        default: ''

jobs:
  check-new-sets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: Detect new sets
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.set_code }}" ]; then
            echo "Manual override: ${{ github.event.inputs.set_code }}"
            result='[{"code":"${{ github.event.inputs.set_code }}","name":"override","released":"manual"}]'
          else
            result=$(node scripts/detect-new-sets.js)
          fi
          echo "Detected: $result"
          echo "sets=$result" >> "$GITHUB_OUTPUT"

      - name: Generate configs
        if: steps.detect.outputs.sets != '[]'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo '${{ steps.detect.outputs.sets }}' | node -e "
            const stdin = require('fs').readFileSync(0,'utf8');
            const sets = JSON.parse(stdin);
            for (const s of sets) console.log(s.code);
          " | while read code; do
            echo "=== Generating config for $code ==="
            node scripts/generate-config.js "$code" || echo "WARN: generation failed for $code"
          done

      - name: Validate
        if: steps.detect.outputs.sets != '[]'
        run: |
          node validate.js --check-scryfall
          echo '${{ steps.detect.outputs.sets }}' | node -e "
            const stdin = require('fs').readFileSync(0,'utf8');
            const sets = JSON.parse(stdin);
            for (const s of sets) console.log(s.code);
          " | while read code; do
            if [ -f "boosters/${code}-play.json" ]; then
              node scripts/validate-generated.js "$code" || echo "WARN: validation failed for $code"
            fi
          done

      - name: Commit and push
        if: steps.detect.outputs.sets != '[]'
        run: |
          git diff --quiet metadata.json index.json boosters/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boosters/ index.json metadata.json
          git commit -m "auto: add booster configs for new sets"
          git push

      - name: Trigger homepage update
        if: steps.detect.outputs.sets != '[]'
        env:
          HOMEPAGE_DISPATCH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$HOMEPAGE_DISPATCH_TOKEN" ]; then
            echo "HOMEPAGE_DISPATCH_TOKEN not set — skipping downstream trigger (homepage will pick up on its daily cron)"
            exit 0
          fi
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEPAGE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/benson/benson.github.io/actions/workflows/update-sets.yml/dispatches \
            -d '{"ref":"master"}'
